# Supabase project ID. The CLI will fill this in for you when you run
# `supabase link --project-ref <ref>` in Phase 2b. Until then, leave it
# as a placeholder — the local config is still valid.
project_id = "subtrack"

# API port for `supabase start` (local dev only). 54321 matches Supabase defaults.
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# 15 is the current Supabase default major version.
major_version = 15

[db.pooler]
enabled = false
# port = 54329
# pool_mode = "transaction"
# default_pool_size = 20
# max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # personal project: skip email confirmation in dev
secure_password_change = true

[edge_runtime]
enabled = true
# policy = "oneshot"  # Supabase >= 1.121

[analytics]
enabled = false
